apiVersion: v1
kind: ConfigMap
metadata:
  name: gotaskq-config
  labels:
    app: gotaskq
data:
  KAFKA_BROKERS: "kafka:9092"
  KAFKA_TOPIC: "jobs"
  KAFKA_CONSUMER_GROUP: "gotaskq-workers"
  KAFKA_COMPRESSION_CODEC: "2"
  KAFKA_FLUSH_FREQUENCY_MS: "5"
  KAFKA_FLUSH_BYTES: "1048576"
  KAFKA_CHANNEL_BUFFER_SIZE: "256"
  REDIS_ADDRESSES: "redis-0:6379,redis-1:6379,redis-2:6379"
  REDIS_POOL_SIZE: "20"
  POSTGRES_MAX_CONNS: "50"
  POSTGRES_MIN_CONNS: "10"
  POSTGRES_MAX_CONN_LIFETIME: "30m"
  POSTGRES_MAX_CONN_IDLE_TIME: "5m"
  POSTGRES_HEALTH_CHECK_PERIOD: "1m"
  WORKER_CONCURRENCY: "50"
  WORKER_QUEUE_SIZE: "500"
  HTTP_ADDRESS: ":8080"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  METRICS_NAMESPACE: "gotaskq"
  METRICS_SUBSYSTEM: "server"
